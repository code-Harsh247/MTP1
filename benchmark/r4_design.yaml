# Study v2, R4: Nested Learning for continual enrollment, task-boundary CMS (plan.md option b).
# EXPLORATORY: designed after the R3 result was seen (RQ2: NO), so it is a follow-up, not a
# pre-registered test of RQ2. It is still committed before any R4 run.
#
# Why: in R3 the period-256 copy updated only 1-3 times on AMI, AWE and IITD, so the slow memory
# barely acted. Here the periods follow each cell's task length S (steps per task, from
# benchmark/recipes.yaml), so every dataset gets the same schedule:
#   copy 1 every step              (learns the current task)
#   copy 2 every S steps           (one consolidation step at the end of each task)
#   copy 3 every slow_tasks*S      (long-term memory, updated every few tasks)
# Everything else is as in R3's primary arm: naive training, no replay, and the cell's slow-lr
# value from benchmark/r3_lr_pow.yaml (no new tuning).
#
# Cells: only those where R2 showed forgetting. UERC's are added only if its R2 shows them.
#
# Judged by benchmark/r3_rule.yaml's REDUCED / FIXED test against naive (scripts/r4_report.py),
# and also compared with R3's CMS, descriptively.
slow_tasks: 2
cells:
  ami: [plain_transformer]
  awe: [modern_cnn, plain_transformer, hierarchical_transformer]
  earvn: [classic_cnn, modern_cnn, lightweight_cnn, plain_transformer, hierarchical_transformer]
