# Study v2, R5: why did CMS not reduce forgetting? EXPLORATORY.
# Designed after R3, R4, R4b and the EarVN ConvNeXt-T diagnostics (notes/cms_diagnostics.md) were
# seen, and committed before any R5 run. It tests the two explanations the report gives:
#
#   A. The slow update is too small: one AdamW step on a period's summed gradient moves a period-C
#      copy about as far as one ordinary step, so it learns ~1/C as much as NL's rule implies.
#   B. The memory is diluted: CMS outputs a weighted sum of the copies, so even a copy that remembers
#      the old people is only ~1/3 of the layer's output, and the neck and the rest of the backbone
#      forget outside CMS.
#
# Experiment 1 (tests A). R3's periods (1, 16, 256) with a full-size slow update, two ways:
#   1a  lr_pow 1: one AdamW step on the summed gradient, lr scaled by the period C;
#   1b  per-step: an AdamW step on every gradient (taken at the unchanged live weights), applied to the
#       model every C steps, i.e. the sum of C ordinary updates ([NL] Eq. 71 with f = the optimizer's
#       update; nlear.cms._PerStepSlow).
#   Judged against naive with benchmark/r3_rule.yaml's REDUCED / FIXED test (scripts/r5_report.py).
#   Reading: if the slow copies now move as far as copy 1 (diagnostics) and forgetting drops, A is
#   supported; if they move but forgetting does not drop, A is not enough.
#
# Experiment 2 (tests A and B). Diagnostics with saved weights on EarVN ConvNeXt-T seed 1 for R4b,
#   1a, 1b and 3: how far each copy moved, how much of the task-1 loss each part holds, and each copy
#   scored alone. Tells apart "the memory never formed" from "it formed but is diluted".
#
# Experiment 3 (tests B). Upper bound for a perfect slow memory: copies 2 and 3 take no gradient and
#   are set to copy 1's weights at the end of task 1, then frozen (nlear.cms.TaskSnapshot). Primary
#   readout: task-1 rank-1 forgetting (column 1 of A) against naive's, alongside the usual summary.
#   Reading: if task 1 is still largely forgotten even with 2 of 3 copies frozen at its weights, the
#   weighted-sum design itself limits CMS (B); if task 1 is kept, a working slow memory would help.
#
# Experiment 5 (generality). Diagnostics (naive and R3) on two more shown cells, a transformer on
#   EarVN and a different dataset, to check the localisation and slow-copy results beyond one CNN.
#
# Seeds: the reported seeds of EarVN (1-3). No new tuning: every run uses its cell's R1 recipe.
cells_exp1: [classic_cnn, modern_cnn]          # EarVN
variants_exp1:
  pow1: {lr_pow: 1, slow: sum}
  perstep: {lr_pow: 0, slow: per-step}
cell_exp3: modern_cnn                          # EarVN
snapshot_after_task: 1
diag_exp2:                                     # EarVN ConvNeXt-T, seed 1
  dataset: earvn
  model: modern_cnn
  arms: [r5pow1, r5step, r4b, r5snap]
diag_exp5:
  - {dataset: earvn, model: plain_transformer, arms: [naive, r3]}
  - {dataset: awe, model: hierarchical_transformer, arms: [naive, r3]}
diag_seed: 1
